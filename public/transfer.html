<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>QR Transfer</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/display.js"></script>
</head>
<body class="transfer">
  <main class="stage">
    <header class="topbar">
      <div class="title">
        <h1 id="name">QR Transfer</h1>
        <p id="facts" class="muted small"></p>
      </div>
      <span id="expiry" class="pill" hidden></span>
    </header>

    <div id="viewport" class="viewport">
      <div id="qrbox" class="qrbox" hidden><canvas id="qr" aria-label="Animated QR code"></canvas></div>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Loading…</h2>
        <p id="overlayText" class="muted"></p>
        <progress id="overlayBar" max="1" hidden></progress>
      </div>
    </div>

    <section id="status" class="status" hidden>
      <div class="statusline">
        <span id="frame">Frame –</span>
        <span id="pass" class="muted">Pass 1</span>
      </div>
      <progress id="loop" max="1" value="0"></progress>
    </section>

    <section id="controls" class="controls" hidden>
      <label class="field">
        <span>Speed <output id="fpsOut"></output></span>
        <input id="fps" type="range" step="1">
      </label>
      <label class="field">
        <span>Density</span>
        <select id="density"></select>
      </label>
      <label class="field">
        <span>Error correction</span>
        <select id="ecc"></select>
      </label>
      <div class="row">
        <button id="pause" type="button">Pause</button>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
    </section>

    <p id="instructions" class="instructions muted small" hidden>
      Open <strong>QR Transfer</strong> on your Android phone and point the camera at the code from
      20–40 cm. Keep this page open until the phone reports the file as complete.
      If the phone struggles, lower the density or the speed. Changing density restarts the stream.
    </p>
  </main>
</body>
</html>
